plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1-SNAPSHOT'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.silvionetto'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
	maven { url = 'https://repo.spring.io/snapshot' }
}

ext {
	set('springAiVersion', "2.0.0")
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.postgresql:postgresql:42.7.4'
	implementation 'org.springframework.ai:spring-ai-starter-vector-store-pgvector'

	implementation 'org.springframework.boot:spring-boot-starter-json'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.ai:spring-ai-starter-model-openai'
	testImplementation 'org.springframework.boot:spring-boot-test-autoconfigure'
	testImplementation 'org.springframework.boot:spring-boot-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.register('scanSecrets') {
	group = 'verification'
	description = 'Scans the repository for obvious hardcoded secrets before commits.'
	doLast {
		def findings = []
		def patterns = [
			~/AKIA[0-9A-Z]{16}/,
			~/ASIA[0-9A-Z]{16}/,
			~/ghp_[A-Za-z0-9]{20,}/,
			~/github_pat_[A-Za-z0-9_]{20,}/,
			~/sk-[A-Za-z0-9]{20,}/
		]
		fileTree(projectDir) {
			exclude '.git/**'
			exclude '.gradle/**'
			exclude 'build/**'
			exclude '.env'
		}.matching {
			include '**/*'
		}.files.each { file ->
			if (file.isFile()) {
				int lineNumber = 0
				file.eachLine { line ->
					lineNumber++
					patterns.each { pattern ->
						if (line =~ pattern) {
							findings << "${projectDir.toPath().relativize(file.toPath())}:${lineNumber}: ${line.trim()}"
						}
					}
				}
			}
		}
		if (!findings.isEmpty()) {
			throw new GradleException("Potential secrets detected:\n" + findings.join('\n'))
		}
	}
}
