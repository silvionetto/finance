spring.application.name=finance
spring.ai.openai.api-key=${OPENAI_API_KEY:${AZURE_OPENAI_API_KEY:}}
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
# spring.ai and ticker catalog properties are consumed via Spring Boot binding at runtime.

financial-modeling-prep.api-key=${FMP_API_KEY:}
financial-modeling-prep.base-url=${FMP_BASE_URL:https://financialmodelingprep.com}

polygon.api-key=${POLYGON_API_KEY:}
polygon.base-url=${POLYGON_BASE_URL:https://api.polygon.io}

b3.base-url=${B3_BASE_URL:https://www.b3.com.br}

ticker-catalog.resource-path=${TICKER_CATALOG_PATH:docs/tickers.json}

watchlist.items[0].company-name=Apple Inc.
watchlist.items[0].ticker-symbol=AAPL
watchlist.items[0].exchange=NASDAQ
watchlist.items[0].target-price=250
watchlist.items[0].stop-loss=180
watchlist.items[0].notes=Core long-term holding

watchlist.items[1].company-name=Microsoft Corporation
watchlist.items[1].ticker-symbol=MSFT
watchlist.items[1].exchange=NASDAQ
watchlist.items[1].target-price=500
watchlist.items[1].stop-loss=360
watchlist.items[1].notes=Quality growth benchmark

finance.analysis.buy-threshold=0.05
finance.analysis.sell-threshold=0.05
finance.analysis.refresh-minutes=30

finance.market.primary-source=polygon
finance.market.fallback-source=b3