spring.application.name=finance
spring.ai.openai.api-key=${OPENAI_API_KEY:${AZURE_OPENAI_API_KEY:}}
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
# spring.ai properties are consumed via Spring Boot binding at runtime.

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/finance}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:finance}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:finance}
spring.datasource.hikari.initialization-fail-timeout=0

spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true

spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=1536

financial-modeling-prep.api-key=${FMP_API_KEY:}
financial-modeling-prep.base-url=${FMP_BASE_URL:https://financialmodelingprep.com}

brapi.api-token=${BRAPI_API_TOKEN:}
brapi.base-url=${BRAPI_BASE_URL:https://brapi.dev}

polygon.api-key=${POLYGON_API_KEY:}
polygon.base-url=${POLYGON_BASE_URL:https://api.polygon.io}

alpaca.api-key-id=${ALPACA_API_KEY_ID:}
alpaca.api-secret-key=${ALPACA_API_SECRET_KEY:}
alpaca.base-url=${ALPACA_BASE_URL:https://data.alpaca.markets}
alpaca.feed=${ALPACA_FEED:iex}

euronext.auth-key=${EURONEXT_AUTH_KEY:256f0720127269acfcb390b5adef10c242469c41afd08426744324bee3e2d75a}
euronext.base-url=${EURONEXT_BASE_URL:https://gateway.euronext.com}
