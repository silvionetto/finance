<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Change Password</title>
	<link rel="stylesheet" href="/css/workspace.css">
	<style>
		:root { color-scheme: light dark; font-family: system-ui, sans-serif; }
		body { margin: 0; background: #f5f7fb; color: #1f2937; }
		main { max-width: 640px; margin: 0 auto; padding: 1.5rem; min-height: 100dvh; box-sizing: border-box; display: grid; align-content: center; }
		.card { background: #ffffff; border-radius: 18px; box-shadow: 0 8px 30px rgba(15, 23, 42, 0.08); padding: 1.5rem; display: grid; gap: 1rem; }
		h1, p { margin: 0; }
		form { display: grid; gap: 0.9rem; }
		label { display: grid; gap: 0.45rem; font-size: 0.92rem; font-weight: 600; color: #334155; }
		input, button, a { font: inherit; }
		input { width: 100%; padding: 0.9rem; border-radius: 12px; border: 1px solid #cbd5e1; box-sizing: border-box; }
		.actions { display: flex; gap: 0.75rem; flex-wrap: wrap; }
		button, a {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			border: 0;
			border-radius: 999px;
			padding: 0.8rem 1.25rem;
			background: #2563eb;
			color: #ffffff;
			cursor: pointer;
			text-decoration: none;
		}
		a { background: #e2e8f0; color: #0f172a; }
		.status { min-height: 1.5rem; color: #475569; }
	</style>
</head>
<body>
	<meta name="_csrf" th:content="${_csrf.token}">
	<meta name="_csrf_header" th:content="${_csrf.headerName}">
	<main>
		<div th:replace="~{fragments/navigation :: workspaceNav('password')}"></div>
		<section class="card">
			<h1>Change password</h1>
			<p>Replace the bootstrap password from your environment with a personal password.</p>
			<form id="change-password-form">
				<label for="currentPassword">
					Current password
					<input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required>
				</label>
				<label for="newPassword">
					New password
					<input id="newPassword" name="newPassword" type="password" autocomplete="new-password" required>
				</label>
				<div class="actions">
					<button id="change-password-button" type="submit">Save new password</button>
				</div>
			</form>
			<div id="password-status" class="status" role="status" aria-live="polite"></div>
		</section>
	</main>
	<script>
		const form = document.getElementById('change-password-form');
		const currentPasswordInput = document.getElementById('currentPassword');
		const newPasswordInput = document.getElementById('newPassword');
		const changePasswordButton = document.getElementById('change-password-button');
		const status = document.getElementById('password-status');
		const csrfToken = document.querySelector('meta[name="_csrf"]')?.content;
		const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content;

		function jsonHeaders() {
			const headers = { 'Content-Type': 'application/json' };
			if (csrfToken && csrfHeader) {
				headers[csrfHeader] = csrfToken;
			}
			return headers;
		}

		async function readResponseError(response, fallback) {
			const body = await response.text();
			if (!body) {
				return `${fallback} (status ${response.status})`;
			}
			try {
				const payload = JSON.parse(body);
				return payload.message ?? payload.error ?? fallback;
			} catch {
				return `${fallback} ${body}`;
			}
		}

		form.addEventListener('submit', async (event) => {
			event.preventDefault();
			const currentPassword = currentPasswordInput.value.trim();
			const newPassword = newPasswordInput.value.trim();
			if (!currentPassword || !newPassword) {
				status.textContent = 'Fill in both password fields.';
				return;
			}

			changePasswordButton.disabled = true;
			status.textContent = 'Saving your new password...';

			try {
				const response = await fetch('/api/account/password', {
					method: 'POST',
					headers: jsonHeaders(),
					body: JSON.stringify({ currentPassword, newPassword })
				});
				if (!response.ok) {
					throw new Error(await readResponseError(response, 'Unable to change password.'));
				}
				form.reset();
				status.textContent = 'Password changed successfully.';
				currentPasswordInput.focus();
			} catch (error) {
				status.textContent = error instanceof Error && error.message ? error.message : 'Unable to change password.';
			} finally {
				changePasswordButton.disabled = false;
			}
		});
	</script>
</body>
</html>
