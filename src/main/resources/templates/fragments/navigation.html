<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
	<nav th:fragment="workspaceNav(activePage)" class="workspace-nav" aria-label="Workspace navigation">
		<a class="workspace-brand" href="/" aria-label="Finance home">
			<span class="workspace-brand-mark" aria-hidden="true">FN</span>
			<span>Finance</span>
		</a>
		<div class="workspace-nav-menu">
			<a class="workspace-nav-link" href="/" th:attr="aria-current=${activePage == 'chat' ? 'page' : null}">Chat</a>
			<a class="workspace-nav-link" href="/wallet" th:attr="aria-current=${activePage == 'wallet' ? 'page' : null}">Wallet</a>
			<a class="workspace-nav-link" href="/account/password" th:attr="aria-current=${activePage == 'password' ? 'page' : null}">Account</a>
			<form method="post" action="/logout">
				<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
				<button class="workspace-nav-logout" type="submit">Sign out</button>
			</form>
		</div>
		<details class="workspace-nav-mobile">
			<summary class="workspace-nav-summary">Menu</summary>
			<div class="workspace-nav-menu">
				<a class="workspace-nav-link" href="/" th:attr="aria-current=${activePage == 'chat' ? 'page' : null}">Chat</a>
				<a class="workspace-nav-link" href="/wallet" th:attr="aria-current=${activePage == 'wallet' ? 'page' : null}">Wallet</a>
				<a class="workspace-nav-link" href="/account/password" th:attr="aria-current=${activePage == 'password' ? 'page' : null}">Account</a>
				<form method="post" action="/logout">
					<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
					<button class="workspace-nav-logout" type="submit">Sign out</button>
				</form>
			</div>
		</details>
	</nav>
</body>
</html>
