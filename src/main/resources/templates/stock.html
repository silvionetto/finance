<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="${entry.symbol() + ' analysis'}">Stock analysis</title>
	<link rel="stylesheet" href="/css/workspace.css">
	<style>
		main{max-width:1000px;margin:0 auto;padding:2rem}
		.card{background:#fff;border-radius:16px;padding:1.5rem;margin-top:1rem;box-shadow:0 8px 30px rgba(15,23,42,.08)}
		.analysis{border-top:1px solid #e2e8f0;padding-top:1rem;margin-top:1rem}
		.analysis-markdown{display:grid;gap:.75rem;line-height:1.5}
		.analysis-markdown>:first-child{margin-top:0}
		.analysis-markdown>:last-child{margin-bottom:0}
		.analysis-markdown p,.analysis-markdown ul,.analysis-markdown ol,.analysis-markdown blockquote,.analysis-markdown pre,.analysis-markdown table,.analysis-markdown hr{margin:0}
		.analysis-markdown ul,.analysis-markdown ol{padding-left:1.5rem}
		.analysis-markdown li+li{margin-top:.25rem}
		.analysis-markdown a{color:#1d4ed8}
		.analysis-markdown code{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace;background:rgba(15,23,42,.08);border-radius:6px;padding:.15rem .35rem;font-size:.95em}
		.analysis-markdown pre{padding:.9rem 1rem;border-radius:12px;background:#0f172a;color:#e2e8f0;overflow-x:auto}
		.analysis-markdown pre code{background:transparent;padding:0;border-radius:0;color:inherit}
		.analysis-markdown blockquote{padding-left:1rem;border-left:4px solid #93c5fd;color:#334155}
		.analysis-markdown table{width:100%;border-collapse:collapse;display:block;overflow-x:auto}
		.analysis-markdown th,.analysis-markdown td{border:1px solid #bfdbfe;padding:.55rem .7rem;text-align:left}
		.analysis-markdown th{background:rgba(191,219,254,.45)}
		.analysis-markdown hr{border:0;border-top:1px solid #93c5fd}
		.analysis-plain-text{margin:0;white-space:pre-wrap;word-break:break-word}
		.actions{display:flex;gap:.75rem;align-items:center}.button{border:0;border-radius:999px;padding:.8rem 1.25rem;background:#2563eb;color:#fff;text-decoration:none;cursor:pointer}#status{color:#475569}
	</style>
</head>
<body>
<nav th:replace="~{fragments/navigation :: workspaceNav('stock')}"></nav>
<main>
	<a href="/">Back to workspace</a>
	<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
	<section class="card">
		<h1 th:text="${entry.symbol()}">AAPL</h1>
		<p th:text="${entry.companyName()}">Apple Inc.</p>
		<div class="actions">
			<button id="new-analysis" class="button" type="button">Create new analysis</button>
			<button id="new-prediction" class="button" type="button">Create prediction</button>
			<span id="status" aria-live="polite"></span>
		</div>
		<div th:replace="~{fragments/loading-indicator :: loadingIndicator}"></div>
	</section>
	<section class="card">
		<h2>Past analyses</h2>
		<p th:if="${#lists.isEmpty(analyses)}">No analyses saved yet.</p>
		<article class="analysis" th:each="analysis : ${analyses}">
			<header><strong th:text="${analysis.type() + ' - ' + #temporals.format(analysis.createdAt(), 'yyyy-MM-dd HH:mm')}">ANALYSIS - 2026-09-18</strong></header>
			<div class="analysis-markdown" th:attr="data-markdown=${analysis.generatedOutput()}">
				<pre class="analysis-plain-text" th:text="${analysis.generatedOutput()}">Report</pre>
			</div>
		</article>
	</section>
	<section class="card">
		<h2>Comparison</h2>
		<p>Load stored baselines and later market observations on demand.</p>
		<button id="load-comparison" class="button" type="button">Load comparison data</button>
		<pre id="comparison" hidden></pre>
	</section>
</main>
<script src="/webjars/dompurify/3.2.6/dist/purify.min.js"></script>
<script src="/webjars/marked/15.0.12/lib/marked.umd.js"></script>
<script src="/js/loading-indicator.js"></script>
<script th:inline="javascript">
const symbol = /*[[${entry.symbol()}]]*/ 'AAPL';
const status = document.getElementById('status');
const analysisButton = document.getElementById('new-analysis');
const predictionButton = document.getElementById('new-prediction');
const generationButtons = [analysisButton, predictionButton];
const requestTimeoutMilliseconds = 120000;

function renderMarkdown(markdown) {
	if (!window.marked || !window.DOMPurify) {
		throw new Error('Markdown rendering libraries are unavailable.');
	}
	return window.DOMPurify.sanitize(window.marked.parse(markdown ?? '', {
		gfm: true,
		breaks: true
	}));
}

function renderSavedResults() {
	document.querySelectorAll('.analysis-markdown[data-markdown]').forEach((container) => {
		const markdown = container.dataset.markdown ?? '';
		try {
			container.innerHTML = renderMarkdown(markdown);
			container.querySelectorAll('a[href]').forEach((link) => {
				link.target = '_blank';
				link.rel = 'noopener noreferrer';
			});
		} catch (error) {
			container.replaceChildren();
			const fallback = document.createElement('pre');
			fallback.className = 'analysis-plain-text';
			fallback.textContent = markdown;
			container.appendChild(fallback);
		}
	});
}

async function generateStockResult(path) {
	const csrf = document.querySelector('input[name="_csrf"]');
	const controller = new AbortController();
	const timeoutId = window.setTimeout(() => controller.abort(), requestTimeoutMilliseconds);
	financeLoadingIndicator.start({ statusElement: status });
	generationButtons.forEach((button) => { button.disabled = true; });
	try {
		const response = await fetch(path, {
			method: 'POST',
			headers: {'Content-Type': 'application/json', 'X-CSRF-TOKEN': csrf?.value || ''},
			signal: controller.signal
		});
		if (!response.ok) {
			throw new Error(`Request failed with status ${response.status}`);
		}
		await response.json();
		window.location.reload();
	} catch (error) {
		status.textContent = error?.name === 'AbortError'
			? 'The request took too long. Please try again.'
			: 'Unable to generate the requested stock result. Please try again.';
	} finally {
		window.clearTimeout(timeoutId);
		financeLoadingIndicator.stop();
		generationButtons.forEach((button) => { button.disabled = false; });
	}
}

analysisButton.addEventListener('click', () => generateStockResult(`/api/stocks/${encodeURIComponent(symbol)}/analyses`));
predictionButton.addEventListener('click', () => generateStockResult(`/api/stocks/${encodeURIComponent(symbol)}/predictions`));
document.getElementById('load-comparison').addEventListener('click', async () => {
 const target = document.getElementById('comparison'); target.hidden = false; target.textContent = 'Loading...';
 const response = await fetch(`/api/stocks/${encodeURIComponent(symbol)}/comparison`);
 target.textContent = response.ok ? JSON.stringify(await response.json(), null, 2) : await response.text();
});

renderSavedResults();
</script>
</body>
</html>
